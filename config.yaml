# Traffic Monitoring & Adaptive Signal System - Configuration
# This file is loaded by detector.py to coordinate parameter values among slices.

# Path to YOLOv8 model weights.
model_path: "yolov8s.pt"

# Path to input traffic intersection video.
video_path: "traffic_sample.mp4"

# Minimum confidence threshold for vehicle filtering.
conf_threshold: 0.20

# Resizing dimensions [width, height] for uniform frame processing.
resize_dims: [800, 600]

# --- Dual Lane Regions of Interest (ROIs) ---
# ROIs are defined as [x1, y1, x2, y2] bounding boxes on the 800x600 canvas
# Lane 1 represents North-Bound (left half) and Lane 2 represents East-Bound (right half)
roi_lane1: [50, 250, 390, 580]
roi_lane2: [410, 250, 750, 580]

# --- Queue & Velocity Tracking Settings ---
# Vehicles with speed (pixels per frame) below this threshold are considered queued/stationary
queue_speed_threshold: 1.5

# --- Swarm Optimization (PSO) Solver Settings ---
pso_particles: 15
pso_iterations: 10
pso_weight_queue: 1.5     # Penalty weight for queue size
pso_weight_wait: 1.0      # Penalty weight for vehicle waiting times
